# species.conf — Pv4 TEST PANEL (5 strains × 3 chromosomes)
#
# A biology-complete subset of the full Pv4 v3 panel for end-to-end pipeline
# testing in ~2-3 h (vs the 30-min smoke test and the ~24-h full run). Hits the
# drug-resistance QC codons (dhps chr14, dhfr-ts chr5), the Pvs230 selection
# example (chr4), and the subtelomeric PIR/PHIST paralog families.
#
# Build the inputs first:  bash v3/pipeline/make_test_data.sh
# Then point the pipeline at this config (copy it to $WORK/pipeline/species.conf).

SPECIES=Pv4test
WORK=/media/anton/data/sandbox/Pv4test            # test workspace (override as needed)

STRAINS=(PvP01 PvW1 PAM PvT01 MHC087)
REF_STRAIN=PvP01
ANCHOR_STRAINS=(PvP01 PvW1 PAM)                    # 3 PlasmoDB anchors; PvT01/MHC087 contribute sequence only

COHORT_VCF_DIR=$WORK/inputs/cohort_vcf
COHORT_CHROM_GLOB='Pv4test_*_v1.vcf.gz'            # chr04/05/14, ~200 samples
CHROM_RENAME=$WORK/inputs/annotations/cohort_chrom_rename.tsv   # 3-row _v1 -> GenBank

N_CORES=16
GPU=0
DOCKER_GPU="--gpus device=$GPU"

# Intactness thresholds scaled for 5 strains (full panel used 7/5 for 8 strains)
MIN_INTACT_STRICT=4                                # present cleanly in all-but-one
MIN_INTACT_RELAXED=3

VAR_ANTIGEN_RE='PIR|PHIST|Pv-fam|MSP|DBP|EBA|RBP|AMA|RAP|SERA|TRAg|STP1|RESA'
# BUSCO lineage stays plasmodium_odb10 (set in the Phase A script).

# This panel includes all strains/chromosomes, so no SMOKE_* subsetting is used —
# Phase I (multiz) runs here, unlike the 1-chromosome smoke test.
