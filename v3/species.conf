# species.conf — Pv4 FULL PANEL (8 strains, complete genomes)
#
# Production config for the full A->K run (cf. pipeline/test_data/species.conf,
# the 5-strain x 3-chr test). Copy/point the pipeline at this file.
# Author: full-Pv4 setup for the Galaxy cluster run.

SPECIES=Pv4

# ARTIFACTS ROOT — MUST be on the 4 TB shared SSD (same volume Galaxy serves over
# NFS). Set PV4_SSD to the SSD mount on the head node, e.g. /mnt/ssd or /data.
WORK=${PV4_SSD:?set PV4_SSD to the 4TB SSD mount}/pv4_full

STRAINS=(PvP01 PvW1 PAM PvSY56 Sal-I PvT01 PvC01 MHC087)   # 8

# REF_STRAIN = pangenome reference (ortholog-table ref column, multiz hinge
# default, hub reference). It must be one of the PlasmoDB anchors below.
# NOTE: the test panel used PvP01, but PvP01 is NOT a full-panel anchor.
# Defaulting to PvW1 (first PlasmoDB anchor); CONFIRM before running.
REF_STRAIN=PvW1

ANCHOR_STRAINS=(PvW1 PAM PvSY56)                  # 3 PlasmoDB-68 annotated anchors

# Assembly accessions (for staging inputs/assemblies/{strain}.fa)
declare -A ACC=(
  [PvP01]=GCA_900093555.2  [PvW1]=GCA_914969965.1  [PAM]=GCA_949152365.1
  [PvSY56]=GCA_003402215.1 [Sal-I]=GCA_000002415.2 [PvT01]=GCA_900093545.1
  [PvC01]=GCA_900093535.1  [MHC087]=GCA_040114635.1
)

# Cohort VCF for Phase J. Use a real MalariaGEN P. vivax population VCF if
# available; else synthesize on REF_STRAIN (see brc-tools execution docs).
COHORT_VCF_DIR=$WORK/inputs/cohort_vcf
COHORT_CHROM_GLOB='Pv4_*.vcf.gz'
CHROM_RENAME=$WORK/inputs/annotations/cohort_chrom_rename.tsv

# Intactness thresholds for 8 strains (test panel used 4/3 for 5 strains).
MIN_INTACT_STRICT=7                                # present cleanly in all-but-one
MIN_INTACT_RELAXED=5

# Cluster: jobs go to the scheduler (Slurm/Pulsar) per the cluster config, not a
# local worker pool. KegAlign -> GPU partition.
N_CORES=32
GPU=0

VAR_ANTIGEN_RE='PIR|PHIST|Pv-fam|MSP|DBP|EBA|RBP|AMA|RAP|SERA|TRAg|STP1|RESA'
